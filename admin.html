<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Swansway Marketing Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter+Tight:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css?v=2">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <style>
.admin-tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:1.5rem}
.admin-tab-btn{padding:10px 20px;font-family:var(--font-m);font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;color:var(--ink-soft);transition:all .15s}
.admin-tab-btn:hover{color:var(--ink)}
.admin-tab-btn.active{color:var(--swansway);border-bottom-color:var(--swansway)}
.admin-table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:6px;margin-bottom:1rem}
.admin-table{width:100%;border-collapse:collapse;font-size:12px;font-family:var(--font-b)}
.admin-table th{background:var(--swansway);color:#fff;padding:9px 12px;font-family:var(--font-m);font-size:10px;letter-spacing:0.06em;text-transform:uppercase;text-align:left;white-space:nowrap}
.admin-table td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.admin-table tr:last-child td{border-bottom:none}
.admin-table tr:hover td{background:var(--surface)}
.admin-input{width:100%;padding:5px 8px;border:1.5px solid var(--border);border-radius:4px;font-family:var(--font-b);font-size:12px;color:var(--ink);background:var(--white);outline:none;min-width:60px}
.admin-input:focus{border-color:var(--swansway)}
.admin-input-num{width:80px;text-align:right}
.admin-input-sm{width:56px;text-align:right}
.admin-actions{display:flex;gap:8px;padding:1rem 0}
.admin-section-header{margin-bottom:1.5rem}
.admin-section-header h2{font-family:var(--font-d);font-size:22px;font-weight:800;color:var(--ink);margin-bottom:4px}
.admin-section-header p{font-size:13px;color:var(--ink-soft)}
.admin-card{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:20px 24px;margin-bottom:1rem}
.admin-card-title{font-family:var(--font-d);font-size:15px;font-weight:700;color:var(--ink);margin-bottom:14px}
.admin-field-label{font-family:var(--font-m);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);margin-bottom:4px}
.brand-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;flex-shrink:0}
.btn-sm{padding:3px 10px;font-size:11px;font-family:var(--font-b);font-weight:600;border:1px solid var(--border);border-radius:3px;cursor:pointer;background:var(--white);color:var(--ink)}
.btn-sm:hover{background:var(--surface)}
.btn-danger{color:#C8102E;border-color:#C8102E}
.btn-danger:hover{background:#fff0f0}
#admin-loading{display:none;position:fixed;inset:0;background:rgba(255,255,255,0.8);z-index:900;align-items:center;justify-content:center;font-family:var(--font-d);font-size:16px;font-weight:700;color:var(--ink-soft)}
</style>

<header class="topbar">
  <div class="topbar-inner">
    <div class="logo-wrap" style="display:flex;align-items:center;gap:14px">
      <a href="index.html" style="display:flex;align-items:center;text-decoration:none">
        <img src="https://npfalcon.b-cdn.net/tenant_d9013b5a-4990-4f3e-beec-4e1fc85990eb/media/uploads/main-logo.svg" alt="Swansway Motor Group" style="height:46px;width:auto;object-fit:contain;filter:brightness(0) invert(1)">
      </a>
      <div style="border-left:1px solid rgba(255,255,255,0.2);padding-left:14px">
        <div style="font-family:var(--font-d);font-size:15px;font-weight:700;color:#fff;line-height:1.2;letter-spacing:-0.01em">⚙️ Admin</div>
      </div>
    </div>
    <div class="topbar-meta">
      <span class="topbar-pill" id="topbar-env-pill">Live <span class="year-ref"></span> Plan</span>
      <button class="user-pill" id="user-pill" onclick="handleUserPillClick()" style="display:none">
        <div class="user-avatar" id="user-avatar">?</div>
        <span id="user-name">Loading…</span>
      </button>
      <div style="position:relative;display:inline-flex;align-items:center">
        <button id="mt-btn" onclick="mtToggle(event)" style="font-family:var(--font-b);font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:6px 14px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);border-radius:2px;color:#fff;cursor:pointer;display:flex;align-items:center;gap:6px">
          MY TASKS
          <span id="mt-badge" style="display:none;background:#C8102E;color:#fff;border-radius:50%;width:18px;height:18px;font-size:10px;font-weight:700;align-items:center;justify-content:center;line-height:1">0</span>
        </button>
        <div id="mt-dropdown" style="display:none;position:absolute;top:calc(100% + 8px);right:0;width:340px;background:var(--white);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,0.15);z-index:500;overflow:hidden">
          <div id="mt-header" style="padding:14px 18px;border-bottom:1px solid var(--border);font-family:var(--font-d);font-size:15px;font-weight:700;color:var(--ink)">Your tasks</div>
          <div id="mt-list" style="max-height:400px;overflow-y:auto"></div>
          <div style="padding:12px 18px;border-top:1px solid var(--border)">
            <button onclick="window.location='index.html#tasks'" style="width:100%;font-family:var(--font-b);font-size:12px;font-weight:700;padding:8px;background:var(--swansway);color:#fff;border:none;border-radius:4px;cursor:pointer">View all tasks →</button>
          </div>
        </div>
      </div>
      <button id="briefs-btn" onclick="openBriefsPanel()" style="font-family:var(--font-b);font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:6px 14px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);border-radius:2px;color:#fff;cursor:pointer">CAMPAIGNS</button>
      <button id="signin-btn" onclick="openAuth()" style="display:none;font-family:var(--font-b);font-size:11px;font-weight:700;padding:6px 16px;background:#fff;color:var(--swansway);border:none;border-radius:2px;cursor:pointer">Sign in</button>
    </div>
  </div>
</header>
<nav class="brand-nav" id="brand-nav">
  <div class="brand-nav-inner" id="brand-nav-inner">
    <div class="nav-dd-wrap" id="nav-intel">
      <button class="nav-dd-btn" onclick="navToggle('nav-intel',event)">Intel <span class="nav-dd-chevron">▾</span></button>
      <div class="nav-dd-panel">
        <button class="nav-dd-item" onclick="window.location='index.html'">Overview</button>
        <button class="nav-dd-item" onclick="window.location='channels.html'">Channels</button>
        <button class="nav-dd-item" onclick="window.location='kpis.html'">KPIs</button>
        <button class="nav-dd-item" onclick="window.location='priorities.html'">Priorities</button>
        <button class="nav-dd-item" onclick="window.location='competitor.html'">Competitors</button>
      </div>
    </div>
    <div class="nav-dd-wrap" id="nav-planning">
      <button class="nav-dd-btn" onclick="navToggle('nav-planning',event)">Planning <span class="nav-dd-chevron">▾</span></button>
      <div class="nav-dd-panel">
        <button class="nav-dd-item" onclick="window.location='calendar.html'">Campaign Calendar</button>
        <button class="nav-dd-item nav-item-cta" onclick="window.location='brief.html'">Campaign Builder</button>
      </div>
    </div>
    <div class="nav-dd-wrap" id="nav-review">
      <button class="nav-dd-btn" onclick="navToggle('nav-review',event)">Review <span class="nav-dd-chevron">▾</span></button>
      <div class="nav-dd-panel">
        <button class="nav-dd-item" onclick="window.location='budget.html'">Budget</button>
        <button class="nav-dd-item" onclick="window.location='autopsy.html'">Autopsy</button>
      </div>
    </div>
    <button class="nav-dd-btn" style="color:var(--swansway);font-weight:700" onclick="window.location='admin.html'">⚙ Admin</button>
  </div>
</nav>


<!-- Auth overlay (shared.js populates) -->
<div class="auth-overlay" id="auth-overlay" onclick="if(event.target===this)closeAuth()">
  <div class="auth-box" style="max-width:380px">
    <div class="auth-header">
      <div class="auth-header-title">Swansway Marketing Hub</div>
      <div class="auth-header-sub">Sign in to access your team workspace</div>
    </div>
    <div style="padding:28px 24px;text-align:center">
      <div style="font-family:var(--font-d);font-size:18px;font-weight:700;color:var(--ink);margin-bottom:6px">Welcome back</div>
      <div style="font-size:13px;color:var(--ink-soft);margin-bottom:24px">Sign in with your Swansway Google account</div>
      <button onclick="authGoogle()" style="width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 16px;border:1.5px solid #dadce0;border-radius:4px;background:#fff;cursor:pointer;font-family:var(--font-b);font-size:14px;font-weight:600;color:#3c4043;transition:box-shadow .2s" onmouseover="this.style.boxShadow='0 1px 8px rgba(0,0,0,0.15)'" onmouseout="this.style.boxShadow='none'">
        <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.16C6.51 42.62 14.62 48 24 48z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.16C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.16C12.43 13.72 17.74 9.5 24 9.5z"/></svg>
        Continue with Google
      </button>
      <div style="font-size:11px;color:var(--ink-faint);margin-top:16px">Access is restricted to authorised Swansway team members</div>
    </div>
  </div>
</div>

<!-- Briefs panel (shared.js populates) -->
<div class="briefs-panel" id="briefs-panel">
  <div class="briefs-panel-header">
    <div class="briefs-panel-title">📋 My Campaigns</div>
    <div style="display:flex;gap:8px;align-items:center">
      <button onclick="window.location='brief.html'" style="font-family:var(--font-b);font-size:11px;font-weight:700;padding:5px 12px;background:var(--accent);border:none;border-radius:4px;color:#fff;cursor:pointer">+ New campaign</button>
      <button class="briefs-panel-close" onclick="closeBriefsPanel()">×</button>
    </div>
  </div>
  <div class="briefs-panel-body">
    <div class="brief-filters" id="brief-filters">
      <div class="brief-filter active" data-brand="all" onclick="filterBriefs('all',this)">All brands</div>
    </div>
    <div id="briefs-list"><div style="text-align:center;padding:40px 20px;color:var(--ink-soft);font-size:13px">Loading your campaigns…</div></div>
  </div>
  <div class="briefs-panel-footer">
    <button class="btn btn-accent" style="width:100%" onclick="window.location='brief.html'">✏ New Campaign</button>
  </div>
</div>


<main id="main-content" class="main">
  <div id="admin-loading">Loading…</div>

  <div class="admin-tabs">
    <button class="admin-tab-btn" data-tab="kpis" onclick="showTab('kpis')">📊 KPI Targets</button>
    <button class="admin-tab-btn" data-tab="team" onclick="showTab('team')">👥 Campaign Team</button>
    <button class="admin-tab-btn" data-tab="budgets" onclick="showTab('budgets')">💷 Site Budgets</button>
    <button class="admin-tab-btn" data-tab="settings" onclick="showTab('settings')">⚙️ Group Settings</button>
  </div>

  <div id="tab-kpis" class="admin-tab-panel"></div>
  <div id="tab-team" class="admin-tab-panel" style="display:none"></div>
  <div id="tab-budgets" class="admin-tab-panel" style="display:none"></div>
  <div id="tab-settings" class="admin-tab-panel" style="display:none"></div>
</main>

<script>
function navBrand(id) { navCloseAll(); window.location = 'brand.html?brand=' + id; }
function switchView(id) { window.location = 'index.html'; }
window.addEventListener('load', function() { adminInit(); });
</script>
</body>
</html>
